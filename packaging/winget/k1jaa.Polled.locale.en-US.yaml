ShortDescription: Open-source Windows gaming input health check, 8K mouse/scroll/network bench, and per-game mouse, display, audio & Wooting profile switcher.
Description: >-
  Polled is an open-source, anti-cheat-safe Windows utility and CLI built in pure Rust.
  It audits 41 Windows input, USB, audio, display, PCI MSI, and network settings with automatic
  one-click revert snapshots, includes a sub-microsecond 8K Raw Input polling, switch bounce,
  scroll encoder, DPI, WASAPI, dual-hop ping, and passive match watchdog benchmark suite, and
  switches per-game mouse settings (Logitech, Razer, Lamzu, Pulsar, Endgame Gear, Keychron,
  VAXEE, Finalmouse, Ninjutso, MCHOSE, Incott), Wooting keyboard profiles, temporary monitor
  resolutions, Windows power plans, and audio endpoints without bloated vendor software.
