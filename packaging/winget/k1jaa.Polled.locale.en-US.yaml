ShortDescription: Open-source Windows gaming input health check, 8K mouse/DPC/reaction bench, Wooting HE keyboard hub, and per-game profile switcher.
Description: >-
  Polled is an open-source, anti-cheat-safe Windows utility and CLI built in pure Rust.
  It audits 41 Windows input, USB, audio, display, PCI MSI, and network settings with automatic
  one-click revert snapshots, includes a sub-microsecond 8K Raw Input polling, switch bounce,
  scroll encoder, QPC click reaction, per-core DPC/IRQ, WASAPI, dual-hop ping, and passive match
  watchdog benchmark suite with persistent run history, provides a dedicated Wooting HE keyboard
  hub with interactive visual keymap, live analog depth, and A<->D counter-strafe analysis, and
  switches per-game mouse, Wooting, display, GPU, notification, and Core Audio mixer settings
  without bloated vendor software.
