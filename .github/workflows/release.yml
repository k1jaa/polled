name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify git tag matches Cargo.toml workspace version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = $tag.TrimStart('v')
          $cargo = Get-Content "Cargo.toml" -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not find workspace version in Cargo.toml"
          }
          $actual = $Matches[1]
          if ($actual -ne $expected) {
            throw "Tag $tag does not match Cargo.toml version $actual. Bump Cargo.toml and tag the release prep commit."
          }
          Write-Host "Verified tag $tag matches Cargo.toml version $actual."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests before packaging
        run: cargo test --workspace

      - name: Build release binaries (CLI + GUI tray app)
        run: cargo build --release -p polled-cli -p polled-gui

      - name: Package portable zip & SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "release-stage/polled-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/polled.exe" "$stage/polled.exe"
          Copy-Item "target/release/polled-gui.exe" "$stage/polled-gui.exe"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "CHANGELOG.md" "$stage/CHANGELOG.md"
          New-Item -ItemType Directory -Force -Path "$stage/docs" | Out-Null
          Copy-Item "docs/SYSTEM_MODIFICATIONS.md" "$stage/docs/SYSTEM_MODIFICATIONS.md"
          Copy-Item "docs/COMPATIBILITY.md" "$stage/docs/COMPATIBILITY.md"

          $zipPath = "polled-$tag-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipPath" | Set-Content -Encoding ascii "SHA256SUMS.txt"

          $ver = $tag.TrimStart('v')
          $changelog = Get-Content "CHANGELOG.md" -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($ver))\][^\r\n]*\r?\n(.*?)(?=^---\s*$|^## \[|\z)"
          $section = ""
          if ($changelog -match $pattern) {
            $section = $Matches[1].Trim()
          }
          if ([string]::IsNullOrWhiteSpace($section)) {
            $section = "See [CHANGELOG.md](https://github.com/k1jaa/polled/blob/$tag/CHANGELOG.md) for full release notes."
          }

          @(
            $section
            ""
            "---"
            ""
            "### Download & Verification"
            "- **Portable Windows x64:** ``$zipPath`` (extract anywhere and run ``polled-gui.exe``)"
            "- **Already on Polled v0.14.3+?** Click **Check for Updates -> Install Update** inside Settings to verify SHA-256 and update in place."
            "- **SHA-256:** ``$hash``"
            "- **Full Changelog:** [CHANGELOG.md](https://github.com/k1jaa/polled/blob/$tag/CHANGELOG.md)"
          ) -join "`n" | Set-Content -Encoding utf8 "RELEASE_NOTES.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Polled ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            polled-*-windows-x64.zip
            SHA256SUMS.txt

  publish-winget:
    name: Submit WinGet Manifest Update
    needs: release-windows
    # Enable once the initial k1jaa.Polled manifest PR is merged into microsoft/winget-pkgs:
    # 1. Add repo secret WINGET_GITHUB_TOKEN (fine-grained PAT with public_repo access to your winget-pkgs fork)
    # 2. Set repo variable WINGET_AUTO_PUBLISH=true
    if: vars.WINGET_AUTO_PUBLISH == 'true'
    runs-on: windows-latest
    steps:
      - name: Submit updated manifest to microsoft/winget-pkgs
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: k1jaa.Polled
          installers-regex: 'polled-v.*-windows-x64\.zip$'
          token: ${{ secrets.WINGET_GITHUB_TOKEN }}
