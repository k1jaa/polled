name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/polled-desktop/package-lock.json

      - name: Build React frontend
        working-directory: apps/polled-desktop
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests before packaging
        run: cargo test --workspace

      - name: Build release binaries (CLI + Desktop tray app)
        run: cargo build --release -p polled-cli -p polled-desktop

      - name: Package portable zip & SHA-256 checksums
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "release-stage/polled-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/polled.exe" "$stage/polled.exe"
          Copy-Item "target/release/polled-desktop.exe" "$stage/polled-desktop.exe"
          Copy-Item "LICENSE" "$stage/LICENSE"
          Copy-Item "README.md" "$stage/README.md"

          $zipPath = "polled-$tag-windows-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipPath" | Set-Content -Encoding ascii "SHA256SUMS.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            polled-*-windows-x64.zip
            SHA256SUMS.txt
