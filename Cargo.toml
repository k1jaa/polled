[workspace]
resolver = "2"
members = [
    "crates/polled-core",
    "crates/polled-cli",
    "crates/polled-gui",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/k1jaa/polled"
authors = ["k1jaa"]

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
notify-rust = "4.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36"
tempfile = "3"
thiserror = "2"
tray-icon = "0.25"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
