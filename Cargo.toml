[workspace]
resolver = "2"
members = [
    "crates/polled-core",
    "crates/polled-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/k1jaa/polled"
authors = ["k1jaa"]

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.36"
tempfile = "3"
thiserror = "2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
